    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
        body{
            background-color: black;
            color: white;

            mask-image: linear-gradient(white, rgba(255, 255, 255, 0.5));

        h3{
            font-size: 25px;
        }
        @keyframes ButtonHover {
            from {transform: translateY(0px);}
            to {transform: translateY(5px);}
        }
        button{
            transition: all 0.1s;
            background-color: black;
            color: white;
            border: white solid 2px;
            border-radius: 5px;
            cursor: pointer;
            animation: ButtonHover 2s ease-in-out infinite alternate ;
            font-family: Outfit, Rubik Arial, sans-serif;
            font-size: 20px;
            position: absolute;
            right: 35%;
            left: 35%;
            bottom: 10%;
        }
        button:hover{
            scale: 1.05;
        }
        button:active{
            scale: 0.95;
        }
        img{
            position: absolute;
            width: 20%;
            min-width: 200px;
            max-width: 250px;
            z-index: -1;
            left: 43%;
            top: 250px;
        }
        #Ash{
            width: 20%;
            top: clamp(510px, 47vw, 600px);

            left: 35%
        }
